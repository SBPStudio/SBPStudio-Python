name: sbp_studio
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - numpy>=1.24           # core numerical arrays
  - scipy>=1.10           # FFT, filters, linalg (Wiener-Levinson)
  - segyio>=1.9           # SEG-Y I/O (conda-forge)
  - pyproj>=3.4           # CRS transformations (Transformer, CRS)
  - matplotlib>=3.7       # colormaps (lazy import in core) + Agg renderer in viz
  - pillow>=9.0           # high-quality RGBA resize + PNG/TIFF save
  - img2pdf               # PDF export: lossless PNG-in-PDF, zero recompression
                          # (installs pikepdf + lxml automatically)
  - psutil>=5.9           # free-RAM probe for the export memory-budget safeguard
                          # (CLI --mem-budget-gb + GUI export RAM guard; optional —
                          #  the code falls back to a conservative estimate if absent)

  # ── Graphical desktop interface (PyQt6 + PyQtGraph) ─────────────────────────
  # Required ONLY for the GUI (`python -m sbp_studio.gui`). The headless core and
  # CLI run without these. conda-forge ships PyQt6 under the package name `pyqt`.
  - pyqt>=6.5             # PyQt6 widgets / Qt 6 desktop application
  - pyqtgraph>=0.13       # GPU/OpenGL-accelerated interactive seismic, map & spectrum views

  # ── Optional performance accelerators ──────────────────────────────────────
  #
  # ── pyfftw (CPU) ────────────────────────────────────────────────────────────
  # FFTW-backed FFTs: 2-5x faster Hilbert transform (envelope) and bandpass.
  # Auto-activated at import time — no code changes needed.
  # Measured speedup on SBP data: ~15-20% faster processing end-to-end
  # (FFT is not the dominant bottleneck beyond ~1000 traces).
  #
  # Install:  conda install -n sbp_studio -c conda-forge pyfftw
  # Verify:   python -m sbp_studio.cli.main accel
  #
  # - pyfftw>=0.13

  # ── CuPy / CUDA (NVIDIA GPU) ─────────────────────────────────────────────
  # GPU acceleration for Hilbert, AGC, RGBA normalisation.
  # Requires an NVIDIA GPU with CUDA support.
  #
  # Step 1 — check your CUDA version:
  #   nvidia-smi       (look at "CUDA Version" in the top-right corner)
  #
  # Step 2 — install the matching cupy-cuda package via pip:
  #   pip install cupy-cuda12x    (for CUDA 12.x or 13.x drivers)
  #   pip install cupy-cuda11x    (for CUDA 11.x drivers)
  #
  # Alternatively via conda-forge (slower to resolve):
  #   conda install -n sbp_studio -c conda-forge cupy cudatoolkit=12.6
  #   (replace 12.6 with your exact CUDA version from nvidia-smi)
  #
  # Verify:   python -m sbp_studio.cli.main accel
  #
  # NOTE — VRAM limits:
  #   Processing a single profile (~52 MB float32): fits in 2 GB VRAM.
  #   Processing a full 6-file chain (~280 MB float32): may OOM on 2 GB cards.
  #   The code falls back silently to the CPU path on CUDA OOM errors.
  #   A GTX 960M (2 GB) will accelerate individual profiles but not full chains.
  #   Cards with ≥4 GB VRAM will accelerate both.
  #
  # - cupy              # installed via pip, not conda (see above)

  # ── Testing ──────────────────────────────────────────────────────────────────
  - pytest>=7.0
  - pytest-timeout
